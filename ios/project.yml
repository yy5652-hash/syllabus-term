name: SyllabusTerm
options:
  bundleIdPrefix: dev.syllabusterm
  deploymentTarget: { iOS: "27.0" }
  createIntermediateGroups: true
configFiles:
  Debug: Secrets.xcconfig
  Release: Secrets.xcconfig
packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    exactVersion: 13.2.0
  TermCore:
    path: TermCore
targets:
  SyllabusTerm:
    type: application
    platform: iOS
    sources: [SyllabusTerm]
    dependencies:
      - package: Firebase
        product: FirebaseAILogic
      - package: Firebase
        product: FirebaseAppCheck
      - package: Firebase
        product: FirebaseRemoteConfig
      - package: TermCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.syllabusterm.app
        PRODUCT_NAME: Syllabus to Term
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Syllabus → Term
        INFOPLIST_KEY_AppCheckDebugToken: $(APPCHECK_DEBUG_TOKEN)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
schemes:
  SyllabusTerm:
    build: { targets: { SyllabusTerm: all } }
    run: { config: Debug }
